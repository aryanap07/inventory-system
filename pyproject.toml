[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "stockflow"
version = "1.0.1"
description = "A cloud-connected CLI inventory system for small workshops"
readme = "readme.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [
    { name = "Aryan Patel", email = "aryanpatel2906.ap@gmail.com" }
]
keywords = ["inventory", "cli", "supabase", "stock", "workshop"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Operating System :: OS Independent",
]
dependencies = [
    "supabase>=2.7.0",
    "python-dotenv>=1.0.1",
    "websockets>=15.0.1",
    "prompt-toolkit==3.0.43",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.4", "mypy>=1.10"]

[project.scripts]
# main.py must define: def main(): from employee.employee_dashboard import run; run()
stockflow = "main:main"

[project.urls]
Homepage     = "https://github.com/aryanap07/inventory-system"
"Bug Tracker" = "https://github.com/aryanap07/inventory-system/issues"

[tool.hatch.build.targets.wheel]
packages = ["employee", "inventory", "services"]

[tool.hatch.build.targets.sdist]
exclude = ["services/.env", ".vscode/", ".git/", "__pycache__/", "dist/", "*.egg-info/"]